name: Tests

on:
  push:
    branches:
      - injective
    paths:
      # INJECTIVE FORK: our diff is deploy config only, so the upstream suite runs
      # only when protocol code, tests, deps or the upstream pin actually move.
      # Keeps the org inside its Actions-minute budget (see plan, "Actions budget").
      - 'src/**'
      - 'test/**'
      - 'lib/**'
      - 'foundry.toml'
      - 'remappings.txt'
      - '.injective-fork-base'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      # INJECTIVE FORK: our diff is deploy config only, so the upstream suite runs
      # only when protocol code, tests, deps or the upstream pin actually move.
      # Keeps the org inside its Actions-minute budget (see plan, "Actions budget").
      - 'src/**'
      - 'test/**'
      - 'lib/**'
      - 'foundry.toml'
      - 'remappings.txt'
      - '.injective-fork-base'
      - '.github/workflows/test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  forge-tests:
    name: Forge Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run tests
        run: forge test --isolate -vvv
        env:
          # INJECTIVE FORK: this fork's default branch is `injective`, so upstream's
          # `ci_main` (100k fuzz runs) could never trigger. `ci` = 10k runs.
          FOUNDRY_PROFILE: ci
